let lang = 'ru';
let shown = 6;
try {
  const saved = localStorage.getItem('safran-lang');
  if (saved && UI[saved]) lang = saved;
  else if (/^kk/i.test(navigator.language)) lang = 'kk';
  else if (/^en/i.test(navigator.language)) lang = 'en';
} catch (e) {}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const money = v => new Intl.NumberFormat('ru-RU').format(v).replace(/\s/g, ' ') + ' ₸';
const img = (src, n) => src + '?h=' + n + '&w=' + n;

function linksHTML(u, withCall) {
  return `<a class="btn solid" href="${LINKS.whatsapp}" target="_blank" rel="noopener">${ICON.whatsapp}WhatsApp</a>` +
    `<a class="btn" href="${LINKS.instagram}" target="_blank" rel="noopener">${ICON.instagram}Instagram</a>` +
    `<a class="btn" href="${LINKS.gis}" target="_blank" rel="noopener">${ICON.gis}${u.gis}</a>` +
    (withCall ? `<a class="btn" href="${LINKS.tel}">${ICON.phone}${u.call}</a>` : '');
}

let reveal;
function setupReveal(animate) {
  if (reveal) reveal.disconnect();
  const els = [...document.querySelectorAll('.reveal')];
  if (!animate || !('IntersectionObserver' in window)) {
    els.forEach(e => e.classList.add('in', 'static'));
    return;
  }
  reveal = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) { en.target.classList.add('in'); reveal.unobserve(en.target); }
    });
  }, { threshold: .12, rootMargin: '0px 0px -6% 0px' });
  els.forEach(e => reveal.observe(e));
}

function renderMenu() {
  const byCat = DATA.cats.map(() => []);
  DATA.items.forEach((it, i) => byCat[it.c].push(i));
  const nav = document.getElementById('cats');
  nav.innerHTML = '<span class="ind" id="ind"></span>' + DATA.cats.map((c, i) =>
    `<button type="button" data-cat="${i}">${esc(c.n[lang])}</button>`).join('');
  document.getElementById('menu').innerHTML = DATA.cats.map((c, ci) => `
    <section class="cat" id="cat-${ci}">
      <div class="cat-head"><span class="no">${String(ci + 1).padStart(2, '0')}</span><h2>${esc(c.n[lang])}</h2></div>
      ${c.note[lang] ? `<p class="cat-note">${esc(c.note[lang])}</p>` : ''}
      <div class="grid">${byCat[ci].map((i, k) => {
        const it = DATA.items[i];
        return `<button type="button" class="card reveal" data-i="${i}" style="--d:${(k % 4) * 80}ms">
          <div class="ph">${it.img ? `<img src="${img(it.img, 480)}" alt="${esc(it.n[lang])}" loading="lazy" decoding="async" onerror="this.remove()">` : ''}</div>
          <h3>${esc(it.n[lang])}</h3>${it.d ? `<p class="d">${esc(it.d[lang])}</p>` : ''}<p class="p">${money(it.p)}</p>
        </button>`;
      }).join('')}</div>
    </section>`).join('');
  observeCats();
}

function renderReviews() {
  const fmt = new Intl.DateTimeFormat(UI[lang].locale, { day: 'numeric', month: 'long', year: 'numeric' });
  const list = DATA.reviews.slice(0, shown);
  document.getElementById('rv').innerHTML = list.map((r, k) => `
    <a class="rv reveal" style="--d:${(k % 3) * 90}ms" href="${LINKS.review(r.id)}" target="_blank" rel="noopener">
      <div class="rv-user">
        <img src="${r.ava}" alt="" loading="lazy" decoding="async">
        <div><b>${esc(r.name)}</b><span>${fmt.format(new Date(r.date + 'T12:00:00'))}</span></div>
      </div>
      <div class="stars" aria-label="${r.rating}/5">${[1, 2, 3, 4, 5].map(n =>
        `<span style="color:${n <= r.rating ? 'var(--a)' : 'var(--a30)'}">${ICON.star}</span>`).join('')}</div>
      <p class="rv-text">${esc(r.text)}</p>
      <span class="rv-go">${UI[lang].openReview} ${ICON.arrow}</span>
    </a>`).join('');
  document.getElementById('more').hidden = shown >= DATA.reviews.length;
}

function renderStatic() {
  const u = UI[lang];
  document.documentElement.lang = lang;
  document.title = u.title;
  document.querySelectorAll('[data-t]').forEach(el => {
    const k = el.dataset.t;
    el.textContent = (k === 'hoursL' && el.closest('footer')) ? u.hoursL2 : u[k];
  });
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  document.getElementById('links-top').innerHTML = linksHTML(u, false);
  document.getElementById('links-foot').innerHTML = linksHTML(u, false);
}

function render(animate) { renderStatic(); renderMenu(); renderReviews(); setupReveal(animate); }

let activeCat = -1;
function syncCats(force) {
  const chips = [...document.querySelectorAll('#cats button')];
  const secs = [...document.querySelectorAll('section.cat')];
  if (!chips.length) return;
  let i = 0;
  secs.forEach((s, j) => { if (s.getBoundingClientRect().top <= 150) i = j; });
  if (i === activeCat && !force) return;
  activeCat = i;
  chips.forEach((b, j) => b.classList.toggle('on', j === i));
  const b = chips[i], box = b.parentElement, ind = document.getElementById('ind');
  ind.style.width = b.offsetWidth + 'px';
  ind.style.transform = 'translateX(' + b.offsetLeft + 'px)';
  box.scrollTo({ left: b.offsetLeft - box.clientWidth / 2 + b.clientWidth / 2, behavior: 'smooth' });
}
function observeCats() { activeCat = -1; syncCats(true); }
addEventListener('scroll', () => syncCats(false), { passive: true });

document.getElementById('cats').addEventListener('click', e => {
  const b = e.target.closest('button[data-cat]');
  if (b) document.getElementById('cat-' + b.dataset.cat).scrollIntoView({ behavior: 'smooth' });
});

document.querySelector('.lang').addEventListener('click', e => {
  const b = e.target.closest('button[data-lang]');
  if (!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  try { localStorage.setItem('safran-lang', lang); } catch (err) {}
  render(false);
});

document.getElementById('menu').addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  const it = DATA.items[+card.dataset.i];
  const im = document.getElementById('dish-img');
  im.hidden = !it.img;
  if (it.img) { im.src = img(it.img, 900); im.alt = it.n[lang]; }
  document.getElementById('dish-n').textContent = it.n[lang];
  document.getElementById('dish-d').textContent = it.d ? it.d[lang] : '';
  document.getElementById('dish-p').textContent = money(it.p);
  document.getElementById('dish').showModal();
});
document.getElementById('dish').addEventListener('click', e => { if (e.target.id === 'dish') e.target.close(); });

document.getElementById('more').addEventListener('click', () => {
  shown += 6;
  renderReviews();
  setupReveal(true);
});

render(true);
</script>
</body>
</html>
