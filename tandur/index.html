<style>
  :root {
    --a: #7B2A17;
    --w: #FFFFFF;
    --a70: rgb(123 42 23 / .7);
    --a50: rgb(123 42 23 / .5);
    --a15: rgb(123 42 23 / .15);
    --a06: rgb(123 42 23 / .06);
    --head: 56px;
    --nav: 52px;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: calc(var(--head) + var(--nav) + 8px); -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--w); color: var(--a);
    font: 400 15px/1.45 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }

  /* header */
  header.top {
    position: sticky; top: 0; z-index: 20; background: var(--w);
    border-bottom: 1px solid var(--a15);
  }
  header.top .wrap { height: var(--head); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .logo { font-weight: 600; font-size: 17px; letter-spacing: .14em; text-decoration: none; white-space: nowrap; }
  .lang { display: flex; border: 1px solid var(--a); border-radius: 999px; overflow: hidden; }
  .lang button { padding: 6px 11px; font-size: 12px; font-weight: 500; letter-spacing: .06em; }
  .lang button[aria-pressed="true"] { background: var(--a); color: var(--w); }

  /* info strip */
  .info { padding-top: 14px; padding-bottom: 6px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
  .info p { margin: 0; font-size: 13px; color: var(--a70); }
  .links { display: flex; gap: 8px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px;
    border: 1px solid var(--a15); border-radius: 999px; text-decoration: none; font-size: 13px; font-weight: 500;
  }
  .pill:hover { border-color: var(--a); }
  .pill svg { width: 16px; height: 16px; flex: none; }

  /* category nav */
  nav.cats {
    position: sticky; top: var(--head); z-index: 15; background: var(--w);
    border-bottom: 1px solid var(--a15);
  }
  nav.cats .wrap { padding: 0; }
  .cats-scroll {
    display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px; height: var(--nav);
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .cats-scroll::-webkit-scrollbar { display: none; }
  .cats-scroll button {
    flex: none; height: 32px; padding: 0 12px; border-radius: 999px; font-size: 13px; white-space: nowrap;
  }
  .cats-scroll button.on { background: var(--a); color: var(--w); }

  /* menu */
  main section.cat { padding-top: 26px; }
  h2 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  .cat-note { margin: 4px 0 0; font-size: 13px; color: var(--a70); }
  .items { list-style: none; margin: 8px 0 0; padding: 0; }
  .item {
    display: grid; grid-template-columns: 1fr 96px; gap: 14px; align-items: start;
    padding: 14px 0; border-bottom: 1px solid var(--a15); cursor: pointer;
  }
  .item.noimg { grid-template-columns: 1fr; }
  .item h3 { margin: 0; font-size: 15.5px; font-weight: 500; line-height: 1.3; }
  .item .d {
    margin: 4px 0 0; font-size: 13px; color: var(--a70);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .item .p { margin: 8px 0 0; font-weight: 600; font-size: 15px; white-space: nowrap; }
  .ph {
    width: 96px; height: 96px; border-radius: 12px; overflow: hidden; background: var(--a06);
  }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* reviews */
  .reviews { padding-top: 44px; padding-bottom: 8px; }
  .rv-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
  .rv-head p { margin: 0; font-size: 13px; color: var(--a70); }
  .rv-head a { font-size: 13px; font-weight: 500; }
  .rv-wrap { position: relative; }
  .rv-scroll {
    display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 14px 16px 18px;
    margin: 0 -16px; scrollbar-width: none;
  }
  .rv-scroll::-webkit-scrollbar { display: none; }
  .rv {
    flex: none; width: min(300px, 82vw); scroll-snap-align: start; text-decoration: none;
    border: 1px solid var(--a15); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .rv:hover { border-color: var(--a); }
  .rv-user { display: flex; align-items: center; gap: 10px; }
  .rv-user img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: var(--a06); flex: none; }
  .rv-user b { display: block; font-weight: 500; font-size: 14.5px; line-height: 1.25; }
  .rv-user span { font-size: 12px; color: var(--a50); }
  .stars { display: flex; gap: 2px; }
  .stars svg { width: 15px; height: 15px; }
  .rv-text {
    margin: 0; font-size: 13.5px; white-space: pre-line; flex: 1;
    display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical; overflow: hidden;
  }
  .rv-go { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .rv-arrows { display: none; gap: 6px; }
  .rv-arrows button { width: 34px; height: 34px; border: 1px solid var(--a15); border-radius: 50%; display: grid; place-items: center; }
  .rv-arrows button:hover { border-color: var(--a); }
  .rv-note { margin: 0; font-size: 12px; color: var(--a50); }

  /* footer */
  footer { margin-top: 36px; background: var(--a); color: var(--w); }
  footer .wrap { padding-top: 32px; padding-bottom: calc(32px + env(safe-area-inset-bottom)); display: grid; gap: 22px; }
  footer h2 { color: var(--w); }
  footer dl { margin: 0; display: grid; gap: 12px; }
  footer dt { font-size: 12px; opacity: .7; }
  footer dd { margin: 2px 0 0; font-size: 15px; }
  footer .pill { border-color: rgb(255 255 255 / .35); }
  footer .pill:hover { border-color: var(--w); }
  footer .links { flex-wrap: wrap; }
  footer small { font-size: 12px; opacity: .7; display: block; }
  footer details summary { cursor: pointer; font-size: 12px; opacity: .7; }
  footer details ul { margin: 8px 0 0; padding-left: 18px; font-size: 12px; opacity: .8; columns: 2 220px; }

  /* dish dialog */
  dialog {
    border: 0; padding: 0; border-radius: 18px; width: min(440px, calc(100vw - 32px));
    color: var(--a); background: var(--w);
  }
  dialog::backdrop { background: rgb(123 42 23 / .45); }
  dialog img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: var(--a06); }
  dialog .body { padding: 16px 18px 20px; }
  dialog h3 { margin: 0; font-size: 18px; font-weight: 600; }
  dialog p { margin: 6px 0 0; font-size: 14px; color: var(--a70); }
  dialog .p { color: var(--a); font-weight: 600; font-size: 17px; margin-top: 12px; }
  dialog .x {
    position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 50%;
    background: var(--w); display: grid; place-items: center;
  }

  @media (min-width: 820px) {
    .items { display: grid; grid-template-columns: 1fr 1fr; column-gap: 40px; }
    .item { grid-template-columns: 1fr 112px; }
    .ph { width: 112px; height: 112px; }
    h2 { font-size: 22px; }
    .rv-arrows { display: flex; }
    .rv { width: 320px; }
    footer .wrap { grid-template-columns: 1fr 1fr; }
  }
  @media (hover: hover) { .item:hover h3 { text-decoration: underline; text-underline-offset: 3px; } }
</style>
</head>

function linksHTML(u) {
  return `<a class="pill" href="${LINKS.instagram}" target="_blank" rel="noopener">${ICON.instagram}Instagram</a>` +
    `<a class="pill" href="${LINKS.whatsapp}" target="_blank" rel="noopener">${ICON.whatsapp}WhatsApp</a>` +
    `<a class="pill" href="${LINKS.gis}" target="_blank" rel="noopener">${ICON.gis}${u.gis}</a>`;
}

function renderMenu() {
  const byCat = DATA.cats.map(() => []);
  DATA.items.forEach((it, i) => byCat[it.c].push(i));
  document.getElementById('cats').innerHTML = DATA.cats.map((c, i) =>
    `<button type="button" data-cat="${i}">${esc(c[lang])}</button>`).join('');
  document.getElementById('menu').innerHTML = DATA.cats.map((c, ci) => `
    <section class="cat" id="cat-${ci}">
      <h2>${esc(c[lang])}</h2>
      ${c.ru === 'Light menu' ? `<p class="cat-note">${UI[lang].lightNote}</p>` : ''}
      <ul class="items">${byCat[ci].map(i => {
        const it = DATA.items[i];
        return `<li class="item${it.img ? '' : ' noimg'}" data-i="${i}">
          <div><h3>${esc(it.n[lang])}</h3>${it.d ? `<p class="d">${esc(it.d[lang])}</p>` : ''}${it.p ? `<p class="p">${money(it.p)}</p>` : ''}</div>
          ${it.img ? `<div class="ph"><img src="${it.img}" alt="${esc(it.n[lang])}" loading="lazy" decoding="async" onerror="this.remove()"></div>` : ''}
        </li>`;
      }).join('')}</ul>
    </section>`).join('');
  observeCats();
}

function renderStatic() {

  document.title = u.title;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = u[el.dataset.t]; });
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  document.getElementById('links-top').innerHTML = linksHTML(u);
  document.getElementById('links-foot').innerHTML = linksHTML(u);
  document.getElementById('credits').innerHTML = DATA.credits.map(c =>
    `<li><a href="${c.url}" target="_blank" rel="noopener">${esc(c.title)}</a></li>`).join('');
}

function render() { renderStatic(); renderMenu(); renderReviews(); }

let io;
function observeCats() {
  if (io) io.disconnect();
  const chips = [...document.querySelectorAll('#cats button')];
  const setOn = i => {
    chips.forEach((b, j) => b.classList.toggle('on', j === i));
    const b = chips[i], box = b.parentElement;
    box.scrollTo({ left: b.offsetLeft - box.clientWidth / 2 + b.clientWidth / 2, behavior: 'smooth' });
  };
  io = new IntersectionObserver(entries => {
    const vis = entries.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
    if (vis) setOn(+vis.target.id.split('-')[1]);
  }, { rootMargin: '-120px 0px -65% 0px' });
  document.querySelectorAll('section.cat').forEach(s => io.observe(s));
  setOn(0);
}

document.getElementById('cats').addEventListener('click', e => {
  const b = e.target.closest('button[data-cat]');
  if (b) document.getElementById('cat-' + b.dataset.cat).scrollIntoView({ behavior: 'smooth' });
});

document.querySelector('.lang').addEventListener('click', e => {
  const b = e.target.closest('button[data-lang]');
  if (!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  try { localStorage.setItem('ush-lang', lang); } catch (err) {}
  render();
});

document.getElementById('menu').addEventListener('click', e => {
  const li = e.target.closest('.item');
  if (!li) return;
  const it = DATA.items[+li.dataset.i];
  const img = document.getElementById('dish-img');
  img.hidden = !it.img;
  if (it.img) { img.src = bigImg(it.img); img.alt = it.n[lang]; }
  document.getElementById('dish-n').textContent = it.n[lang];
  document.getElementById('dish-d').textContent = it.d ? it.d[lang] : '';
  document.getElementById('dish-p').textContent = it.p ? money(it.p) : '';
  document.getElementById('dish').showModal();
});
document.getElementById('dish').addEventListener('click', e => { if (e.target.id === 'dish') e.target.close(); });

const rv = document.getElementById('rv');
document.getElementById('rv-prev').onclick = () => rv.scrollBy({ left: -340, behavior: 'smooth' });
document.getElementById('rv-next').onclick = () => rv.scrollBy({ left: 340, behavior: 'smooth' });

render();
</script>
</body>
</html>
